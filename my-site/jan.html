<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>スキャン画面（JAN/ITF版）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Quagga2 -->
  <script src="https://unpkg.com/@ericblade/quagga2/dist/quagga.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: flex-start;
      padding: 16px;
    }
    h1 { font-size: 18px; margin: 8px 0 4px; text-align: center; }
    p { font-size: 13px; margin: 0 0 12px; text-align: center; color: #ccc; }

    #interactive.viewport {
      width: 100%;
      max-width: 420px;
      height: 260px;
      margin-top: 8px;
      position: relative;
      background: #000;
      overflow: hidden;
      border-radius: 8px;
    }

    #interactive.viewport video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .scan-line {
      position: absolute;
      top: 50%;
      left: 5%;
      width: 90%;
      height: 2px;
      background: red;
      box-shadow: 0 0 8px red;
      transform: translateY(-50%);
      z-index: 10;
    }

    #status { margin-top: 12px; font-size: 14px; text-align: center; color: #8be9fd; }
    #error { margin-top: 4px; font-size: 12px; text-align: center; color: #ff5555; }

    button, select {
      margin-top: 16px;
      padding: 10px 18px;
      font-size: 14px;
      border-radius: 6px;
      border: none;
    }
    button { background: #00b894; color: #fff; }
    select { background: #222; color: #fff; }

    #cancelBtn {
      margin-top: 28px;
      padding: 14px 22px;
      font-size: 16px;
      background: #666;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>バーコード スキャン</h1>
  <p>赤い線にバーコードを合わせてください。</p>

  <div id="interactive" class="viewport">
    <div class="scan-line"></div>
  </div>

  <div id="status">カメラ起動中...</div>
  <div id="error"></div>

  <select id="cameraSelect" style="display:none;"></select>
  <button id="startSelectedBtn" style="display:none;">このカメラで開始</button>
  <button id="stopBtn" style="display:none;">スキャン停止</button>

  <button id="cancelBtn">スキャンできない（下4桁入力）</button>

  <script>
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");
    const stopBtn = document.getElementById("stopBtn");
    const cameraSelect = document.getElementById("cameraSelect");
    const startSelectedBtn = document.getElementById("startSelectedBtn");
    const cancelBtn = document.getElementById("cancelBtn");

    let isRedirecting = false;

    /************************************************************
     * 誤読防止バリデーション（連続一致）
     ************************************************************/
    let lastCode = "";
    let matchCount = 0;
    const REQUIRED_MATCHES = 2; // 2回連続一致で確定
    const VALID_LENGTHS = [8, 13, 14]; // JAN8 / JAN13 / ITF14
    let isLocked = false;

    function onValidatedDetected(result) {
      if (isLocked) return;

      const code = result.codeResult.code;
      if (!code) return;

      // 桁数フィルタ
      if (!VALID_LENGTHS.includes(code.length)) return;

      // 連続一致チェック
      if (code === lastCode) {
        matchCount++;
      } else {
        lastCode = code;
        matchCount = 1;
      }

      if (matchCount >= REQUIRED_MATCHES) {
        isLocked = true;
        setTimeout(() => isLocked = false, 300);

        Quagga.offDetected();
        Quagga.stop();

        onScanSuccess({ codeResult: { code } });

        matchCount = 0;
        lastCode = "";
      }
    }

    /************************************************************
     * スキャナ起動（背面カメラ優先）
     ************************************************************/
    async function startScanner() {
      const devices = await navigator.mediaDevices.enumerateDevices().catch(() => null);
      const videoDevices = devices ? devices.filter(d => d.kind === 'videoinput') : [];

      if (videoDevices.length === 0) {
        statusEl.textContent = "カメラが見つかりません。";
        return;
      }

      initQuagga({ facingMode: "environment" }, function(err) {
        if (!err) {
          statusEl.textContent = "スキャン中...";
          stopBtn.style.display = "inline-block";
          return;
        }

        let backCamera = videoDevices.find(cam =>
          (cam.label || "").toLowerCase().includes("back") ||
          (cam.label || "").toLowerCase().includes("rear") ||
          (cam.label || "").toLowerCase().includes("environment")
        );

        if (backCamera) {
          initQuagga({ deviceId: backCamera.deviceId }, function(err2) {
            if (!err2) {
              statusEl.textContent = "スキャン中...";
              stopBtn.style.display = "inline-block";
              return;
            }
            showCameraSelect(videoDevices);
          });
        } else {
          showCameraSelect(videoDevices);
        }
      });
    }

    /************************************************************
     * Quagga2 初期化
     ************************************************************/
/************************************************************
 * Quagga2 初期化（精度優先＋安全エラー処理＋暗所対策）
 ************************************************************/
  function initQuagga(videoConstraints, callback) {
  
    const config = {
      inputStream: {
        name: "Live",
        type: "LiveStream",
        target: document.querySelector('#interactive'),
        constraints: {
          facingMode: "environment",
          ...(videoConstraints.deviceId ? { deviceId: videoConstraints.deviceId } : {})
        }
      },
  
      decoder: {
        readers: [
          "ean_reader",
          "ean_8_reader",
          {
            format: "i2of5_reader",
            config: {
              checksum: true,              // ★ ITF精度UP
              normalizeBarSpace: true,
              minQuietZoneWidth: 10        // ★ 誤読防止
            }
          }
        ]
      },
  
      // ★ locate OFF → 誤読激減（速度は少し落ちる）
      locate: false,
  
      // ★ 読み取り範囲を狭める（精度が劇的に上がる）
      area: {
        top: "30%",
        right: "10%",
        left: "10%",
        bottom: "30%"
      },
  
      locator: {
        patchSize: "medium",   // ★ 精度優先
        halfSample: false      // ★ 画像縮小しない → 暗所でも強い
      }
    };
  
    Quagga.init(config, async function(err) {
      if (err) {
        console.error("Quagga init error:", err);
  
        // ★ エラー種類別メッセージ
        if (err.name === "NotAllowedError") {
          errorEl.textContent = "カメラの使用が許可されていません。設定を確認してください。";
        } else if (err.name === "NotFoundError") {
          errorEl.textContent = "カメラが見つかりません。デバイスを確認してください。";
        } else {
          errorEl.textContent = "カメラ起動に失敗しました。再試行してください。";
        }
  
        // ★ 半起動状態を防ぐ
        try { Quagga.stop(); } catch(e) {}
  
        stopBtn.style.display = "none";
        statusEl.textContent = "再試行できます。";
  
        return; // callback は使わない
      }
  
      // ★ 正常起動
      Quagga.start();
      Quagga.onDetected(onValidatedDetected);
  
      statusEl.textContent = "スキャン中...";
      stopBtn.style.display = "inline-block";
  
      /************************************************************
       * ★ 暗所対策：torch（ライト）ON（対応端末のみ）
       ************************************************************/
      try {
        const track = Quagga.cameraAccess.getActiveTrack();
        if (track && track.applyConstraints) {
          await track.applyConstraints({ advanced: [{ torch: true }] });
        }
      } catch (e) {
        console.warn("Torch unavailable:", e);
      }
  
      callback && callback(null);
    });
  }


    /************************************************************
     * スキャン成功
     ************************************************************/
    function onScanSuccess(result) {
      // ★ ここで状態リセット
      lastCode = "";
      matchCount = 0;
      isLocked = false;
      
      if (isRedirecting) return;

      const decodedText = result.codeResult.code;
      if (!decodedText) return;

      isRedirecting = true;
      statusEl.textContent = "読み取り成功: " + decodedText;

      if (navigator.vibrate) navigator.vibrate(100);

      try { Quagga.stop(); } catch(e) {}

      const message = { type: "SCAN_SUCCESS", code: decodedText };

      try {
        if (window.opener) window.opener.postMessage(message, "*");
        else window.parent.postMessage(message, "*");
      } catch (e) {}

      setTimeout(() => window.close(), 300);
    }

    /************************************************************
     * 下4桁入力
     ************************************************************/
    cancelBtn.onclick = () => {
      try { Quagga.stop(); } catch(e) {}

      const message = { type: "SCAN_CANCEL" };

      try {
        if (window.opener) window.opener.postMessage(message, "*");
        else window.parent.postMessage(message, "*");
      } catch (e) {}

      window.close();
    };

    stopBtn.addEventListener("click", () => {
      try {
        Quagga.stop();
        statusEl.textContent = "スキャン停止";
        stopBtn.style.display = "none";
      } catch (err) {
        errorEl.textContent = "停止失敗: " + err;
      }
    });

    window.addEventListener("load", startScanner);
  </script>
</body>
</html>

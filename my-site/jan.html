<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>スキャン画面（秋本・外付・JAN/ITF版）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Quagga2 -->
  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: flex-start;
      padding: 16px;
    }
    h1 { font-size: 18px; margin: 8px 0 4px; text-align: center; }
    p { font-size: 13px; margin: 0 0 12px; text-align: center; color: #ccc; }

    /* カメラ映像エリア */
    #interactive.viewport {
      width: 100%;
      max-width: 420px;
      height: 260px;     /* ★ 追加：縦を固定 */
      margin-top: 8px;
      position: relative;
      background: #000;
      overflow: hidden;   /* ★ はみ出しを切る */
      border-radius: 8px;
    }

    #interactive.viewport video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;   /* ★ auto → 100% に変更 */
      object-fit: cover;  /* ★ 画角を自然にトリミング */
    }

    /* 赤線ガイド */
    .scan-line {
      position: absolute;
      top: 50%;             /* ★ ITF に合わせて少し下に */
      left: 5%;
      width: 90%;
      height: 2px;
      background: red;
      box-shadow: 0 0 8px red;
      transform: translateY(-50%);
      z-index: 10;
    }

    #status { margin-top: 12px; font-size: 14px; text-align: center; color: #8be9fd; }
    #error { margin-top: 4px; font-size: 12px; text-align: center; color: #ff5555; }

    button, select {
      margin-top: 16px;
      padding: 10px 18px;
      font-size: 14px;
      border-radius: 6px;
      border: none;
    }
    button { background: #00b894; color: #fff; }
    select { background: #222; color: #fff; }

    /* 下4桁入力ボタンを大きく */
    #cancelBtn {
      margin-top: 28px;
      padding: 14px 22px;
      font-size: 16px;
      background: #666;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>バーコード スキャン</h1>
  <p>赤い線にバーコードを合わせてください。</p>

  <div id="interactive" class="viewport">
    <div class="scan-line"></div>
  </div>

  <div id="status">カメラ起動中...</div>
  <div id="error"></div>

  <select id="cameraSelect" style="display:none;"></select>
  <button id="startSelectedBtn" style="display:none;">このカメラで開始</button>
  <button id="stopBtn" style="display:none;">スキャン停止</button>

  <button id="cancelBtn">スキャンできない（下4桁入力）</button>

  <script>
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");
    const stopBtn = document.getElementById("stopBtn");
    const cameraSelect = document.getElementById("cameraSelect");
    const startSelectedBtn = document.getElementById("startSelectedBtn");
    const cancelBtn = document.getElementById("cancelBtn");

    let isRedirecting = false;

    /************************************************************
     * スキャナ起動（背面カメラ優先）
     ************************************************************/
    async function startScanner() {
      const devices = await navigator.mediaDevices.enumerateDevices().catch(() => null);
      const videoDevices = devices ? devices.filter(d => d.kind === 'videoinput') : [];

      if (videoDevices.length === 0) {
        statusEl.textContent = "カメラが見つかりません。";
        return;
      }

      initQuagga({ facingMode: "environment" }, function(err) {
        if (!err) {
          statusEl.textContent = "スキャン中...";
          stopBtn.style.display = "inline-block";
          return;
        }

        let backCamera = videoDevices.find(cam =>
          (cam.label || "").toLowerCase().includes("back") ||
          (cam.label || "").toLowerCase().includes("rear") ||
          (cam.label || "").toLowerCase().includes("environment")
        );

        if (backCamera) {
          initQuagga({ deviceId: backCamera.deviceId }, function(err2) {
            if (!err2) {
              statusEl.textContent = "スキャン中...";
              stopBtn.style.display = "inline-block";
              return;
            }
            showCameraSelect(videoDevices);
          });
        } else {
          showCameraSelect(videoDevices);
        }
      });
    }

    /************************************************************
     * Quagga2 初期化（JAN/ITF 最適化）
     ************************************************************/
    function initQuagga(videoConstraints, callback) {
      Quagga.init({
        inputStream: {
          name: "Live",
          type: "LiveStream",
          target: document.querySelector('#interactive'),
          constraints: Object.assign({
            facingMode: "environment"
          }, videoConstraints)
        },
        decoder: {
          readers: ["ean_reader", "ean_8_reader", "itf_reader"]
        },
    
        /* ★ JAN/ITF 両対応の最適バランス */
        locate: true,
    
        /* ★ 認識範囲：JAN が入るように上下を広げる */
        area: {
          top: "10%",
          right: "10%",
          left: "10%",
          bottom: "10%"
        }    
        /* ★ patchSize を medium に変更（JAN が読めるようになる） */
        locator: {
          patchSize: "medium",   // ← ITF も読めて JAN も読める最適値
          halfSample: true
        }
      }, function(err) {
        if (!err) {
          Quagga.start();
          Quagga.onDetected(onScanSuccess);
        }
        callback(err);
      });
    }


    /************************************************************
     * カメラ選択
     ************************************************************/
    function showCameraSelect(devices) {
      cameraSelect.style.display = "block";
      startSelectedBtn.style.display = "block";
      cameraSelect.innerHTML = "";

      devices.forEach(cam => {
        const opt = document.createElement("option");
        opt.value = cam.deviceId;
        opt.textContent = cam.label || `カメラ (${cam.deviceId.slice(0,5)})`;
        cameraSelect.appendChild(opt);
      });

      startSelectedBtn.onclick = () => {
        const id = cameraSelect.value;
        try { Quagga.stop(); } catch(e) {}

        initQuagga({ deviceId: id }, function(err) {
          if (!err) {
            statusEl.textContent = "スキャン中...";
            stopBtn.style.display = "inline-block";
            cameraSelect.style.display = "none";
            startSelectedBtn.style.display = "none";
            errorEl.textContent = "";
          } else {
            errorEl.textContent = "起動に失敗: " + err;
          }
        });
      };
    }

    /************************************************************
     * スキャン成功
     ************************************************************/
    function onScanSuccess(result) {
      if (isRedirecting) return;

      const decodedText = result.codeResult.code;
      if (!decodedText) return;

      isRedirecting = true;
      statusEl.textContent = "読み取り成功: " + decodedText;

      if (navigator.vibrate) navigator.vibrate(100);

      try { Quagga.stop(); } catch(e) {}

      const message = { type: "SCAN_SUCCESS", code: decodedText };

      try {
        if (window.opener) window.opener.postMessage(message, "*");
        else window.parent.postMessage(message, "*");
      } catch (e) {}

      setTimeout(() => window.close(), 300);
    }

    /************************************************************
     * 下4桁入力
     ************************************************************/
    cancelBtn.onclick = () => {
      try { Quagga.stop(); } catch(e) {}

      const message = { type: "SCAN_CANCEL" };

      try {
        if (window.opener) window.opener.postMessage(message, "*");
        else window.parent.postMessage(message, "*");
      } catch (e) {}

      window.close();
    };

    stopBtn.addEventListener("click", () => {
      try {
        Quagga.stop();
        statusEl.textContent = "スキャン停止";
        stopBtn.style.display = "none";
      } catch (err) {
        errorEl.textContent = "停止失敗: " + err;
      }
    });

    window.addEventListener("load", startScanner);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>スキャン画面（秋本・外付け・Quagga2版）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- ★ Quagga2 ライブラリの読み込み（無料） -->
  <script src="https://jsdelivr.net" type="text/javascript"></script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: flex-start;
      padding: 16px;
    }
    h1 { font-size: 18px; margin: 8px 0 4px; text-align: center; }
    p { font-size: 13px; margin: 0 0 12px; text-align: center; color: #ccc; }
    
    /* ★ Quagga2用のビデオ表示エリアのスタイル設定 */
    #interactive.viewport {
      width: 100%;
      max-width: 420px;
      margin-top: 8px;
      position: relative;
      background: #000;
      overflow: hidden;
      border-radius: 8px;
    }
    #interactive.viewport video {
      width: 100%;
      height: auto;
      vertical-align: top;
    }
    /* ★ JANコードを合わせやすくするための赤いスキャン補助線 */
    .scan-line {
      position: absolute;
      top: 50%;
      left: 5%;
      width: 90%;
      height: 2px;
      background: red;
      box-shadow: 0 0 8px red;
      transform: translateY(-50%);
      z-index: 10;
    }

    #status { margin-top: 12px; font-size: 14px; text-align: center; color: #8be9fd; word-break: break-all; }
    #error { margin-top: 4px; font-size: 12px; text-align: center; color: #ff5555; }
    button, select {
      margin-top: 16px;
      padding: 10px 18px;
      font-size: 14px;
      border-radius: 6px;
      border: none;
    }
    button { background: #00b894; color: #fff; }
    select { background: #222; color: #fff; }
  </style>
</head>
<body>
  <h1>バーコード スキャン</h1>
  <p>カメラへのアクセスを許可して、赤い線にバーコードを合わせてください。</p>

  <!-- ★ html5-qrcode用の id="reader" を、Quagga2用の枠に変更 -->
  <div id="interactive" class="viewport">
    <div class="scan-line"></div>
  </div>
  
  <div id="status">カメラ起動中...</div>
  <div id="error"></div>

  <select id="cameraSelect" style="display:none;"></select>
  <button id="startSelectedBtn" style="display:none;">このカメラで開始</button>
  <button id="stopBtn" style="display:none;">スキャン停止</button>

  <button id="cancelBtn" style="margin-top: 8px; background:#555;">
    スキャンできない（下4桁入力）
  </button>

  <script>
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");
    const stopBtn = document.getElementById("stopBtn");
    const cameraSelect = document.getElementById("cameraSelect");
    const startSelectedBtn = document.getElementById("startSelectedBtn");
    const cancelBtn = document.getElementById("cancelBtn");

    let isRedirecting = false;

    /************************************************************
     * スキャナ起動（背面カメラ優先）
     ************************************************************/
    async function startScanner() {
      // 端末のカメラ一覧を取得
      const devices = await navigator.mediaDevices.enumerateDevices().catch(() => null);
      const videoDevices = devices ? devices.filter(d => d.kind === 'videoinput') : [];

      if (videoDevices.length === 0) {
        statusEl.textContent = "カメラが見つかりません。";
        return;
      }

      // 1. まずは「背面カメラ（facingMode: environment）」で起動を試みる
      initQuagga({ facingMode: "environment" }, function(err) {
        if (!err) {
          statusEl.textContent = "スキャン中... 赤い線にコードを合わせてください。";
          stopBtn.style.display = "inline-block";
          return;
        }

        // 2. 失敗した場合は、端末内の「back」や「rear」の文字を持つカメラを探す
        let backCamera = videoDevices.find(cam =>
          (cam.label || "").toLowerCase().includes("back") ||
          (cam.label || "").toLowerCase().includes("rear") ||
          (cam.label || "").toLowerCase().includes("environment")
        );

        if (backCamera) {
          initQuagga({ deviceId: backCamera.deviceId }, function(err2) {
            if (!err2) {
              statusEl.textContent = "スキャン中... 赤い線にコードを合わせてください。";
              stopBtn.style.display = "inline-block";
              return;
            }
            // 両方失敗したらカメラ選択のプルダウンを出す
            showCameraSelect(videoDevices);
          });
        } else {
          showCameraSelect(videoDevices);
        }
      });
    }

    /************************************************************
     * Quagga2の初期化・起動関数
     ************************************************************/
    function initQuagga(videoConstraints, callback) {
      Quagga.init({
        inputStream: {
          name: "Live",
          type: "LiveStream",
          target: document.querySelector('#interactive'),
          constraints: Object.assign({
            width: 640,
            height: 480
          }, videoConstraints)
        },
        decoder: {
          // JANコード（EAN-13, EAN-8）のみを対象に指定してノイズを無視する
          readers: ["ean_reader", "ean_8_reader"]
        },
        locate: true // ★ 周辺ノイズからバーコードだけを探し出す重要機能
      }, function(err) {
        if (!err) {
          Quagga.start();
          // 読み取り成功時のイベントを設定
          Quagga.onDetected(onScanSuccess);
        }
        callback(err);
      });
    }

    /************************************************************
     * カメラ選択プルダウンの表示
     ************************************************************/
    function showCameraSelect(devices) {
      cameraSelect.style.display = "block";
      startSelectedBtn.style.display = "block";
      cameraSelect.innerHTML = ""; // 初期化

      devices.forEach(cam => {
        const opt = document.createElement("option");
        opt.value = cam.deviceId;
        opt.textContent = cam.label || `カメラ (${cam.deviceId.slice(0,5)})`;
        cameraSelect.appendChild(opt);
      });

      startSelectedBtn.onclick = () => {
        const id = cameraSelect.value;
        // 動いているカメラがあれば一度停止
        try { Quagga.stop(); } catch(e) {}
        
        initQuagga({ deviceId: id }, function(err) {
          if (!err) {
            statusEl.textContent = "スキャン中... 赤い線にコードを合わせてください。";
            stopBtn.style.display = "inline-block";
            cameraSelect.style.display = "none";
            startSelectedBtn.style.display = "none";
            errorEl.textContent = "";
          } else {
            errorEl.textContent = "選択したカメラの起動に失敗しました: " + err;
          }
        });
      };
    }

    /************************************************************
     * スキャン成功 → GAS へ postMessage
     ************************************************************/
    function onScanSuccess(result) {
      if (isRedirecting) return;
      
      const decodedText = result.codeResult.code;
      if (!decodedText) return;

      isRedirecting = true;
      statusEl.textContent = "読み取り成功: " + decodedText;
      
      if (navigator.vibrate) navigator.vibrate(100);

      // カメラを即時停止
      try { Quagga.stop(); } catch(e) {}

      const message = { type: "SCAN_SUCCESS", code: decodedText };

      try {
        if (window.opener) {
          window.opener.postMessage(message, "*");
        } else {
          window.parent.postMessage(message, "*");
        }
      } catch (e) {}

      setTimeout(() => window.close(), 300);
    }

    /************************************************************
     * キャンセル（下4桁入力） → GAS へ通知
     ************************************************************/
    cancelBtn.onclick = () => {
      // カメラ停止
      try { Quagga.stop(); } catch(e) {}

      const message = { type: "SCAN_CANCEL" };

      try {
        if (window.opener) {
          window.opener.postMessage(message, "*");
        } else {
          window.parent.postMessage(message, "*");
        }
      } catch (e) {}

      window.close();
    };

    /************************************************************
     * 手動停止ボタン
     ************************************************************/
    stopBtn.addEventListener("click", () => {
      try {
        Quagga.stop();
        statusEl.textContent = "スキャンを停止しました。";
        stopBtn.style.display = "none";
      } catch (err) {
        errorEl.textContent = "停止に失敗しました: " + err;
      }
    });

    window.addEventListener("load", startScanner);
  </script>
</body>
</html>
